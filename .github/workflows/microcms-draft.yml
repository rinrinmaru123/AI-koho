name: microCMSに下書きを送る

on:
  push:
    branches: [main]
    paths: ["blog-queue/**.json", "blog-queue/**.png"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: microcms-draft
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 下書きを送る
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_SERVICE: halulu
          MICROCMS_ENDPOINT: blogs
        run: node scripts/post-microcms.js
      - name: 結果を保存
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add blog-queue blog-results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "microCMSへの送信結果を記録

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push

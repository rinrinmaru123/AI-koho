name: Hagurumaのブログを新サイト（microCMS）に出す

on:
  push:
    branches: [main]
    paths: ["hg-queue/**.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: microcms-haguruma
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 送る
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_WRITE_API_KEY }}
        run: node scripts/post-microcms-haguruma.js
      - name: 結果を保存
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add hg-queue hg-results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Haguruma microCMSへの送信結果を記録

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git pull --rebase origin main
          git push
